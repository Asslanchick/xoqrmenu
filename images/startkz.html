
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X.O.</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #111;
            color: #ffffff;
        }

        /* ФОНОВОЕ ИЗОБРАЖЕНИЕ */
        .bg-wrapper {
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.5),
                    rgba(0, 0, 0, 0.85)
                ),
                url('images/401.jpg') center / cover no-repeat;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ОСНОВНОЙ КОНТЕЙНЕР */
        .page {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            min-height: 100dvh;

            padding: 40px 20px 20px;

            display: flex;
            flex-direction: column;
            align-items: center;

            flex: 1;
        }

        /* ЛОГОТИП */
        .logo {
            width: 340px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            margin-bottom: 20px;
            mix-blend-mode: screen;
        }

        /* ЯЗЫКИ */
        .languages {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 0;
        }

        .lang-btn {
            text-decoration: none;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;

            width: 44px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);

            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .lang-btn.active,
        .lang-btn:active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* КОНТАКТЫ */
        .contacts {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));

            row-gap: 30px;
            column-gap: 10px;

            width: 100%;

            /* Сдвигаем контакты в нижнюю часть */
            margin-top: auto;
            margin-bottom: 30px;
        }

        .contact {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            min-width: 0;
        }

        .contact-icon-wrapper {
            width: 56px;
            height: 56px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 12px;
        }

        .contact-icon-wrapper img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .contact-text,
        .contact-text a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
        }

        .contact-text span {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 4px;
        }

        /* КНОПКА МЕНЮ */
        .menu-btn-container {
            width: 100%;

            display: flex;
            justify-content: center;

            margin-bottom: 30px;
        }

        .menu-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            width: 100%;
            max-width: 320px;
            height: 54px;

            background: transparent;
            border: 1.5px solid #ffffff;
            border-radius: 30px;

            color: #ffffff;
            text-decoration: none;

            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;

            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-button:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.1);
        }

        /* ИНФОРМАЦИОННЫЙ БЛОК */
        .info-block {
            display: flex;
            width: 100%;

            border-top: 1px solid rgba(255, 255, 255, 0.2);

            padding-top: 20px;
            margin-top: 0;

            align-items: flex-start;
        }

        .info-col {
            flex: 1;

            display: flex;
            justify-content: center;
            text-align: center;

            padding: 0 10px;
            position: relative;
        }

        /* РАЗДЕЛИТЕЛИ */
        .info-col:not(:last-child)::after {
            content: '';

            position: absolute;
            right: 0;
            top: 2px;
            bottom: 2px;

            width: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .info-text {
            font-size: 11px;
            line-height: 1.35;
            color: rgba(255, 255, 255, 0.85);
        }

        /* МАЛЕНЬКИЕ ЭКРАНЫ */
        @media (max-width: 400px) {
            .page {
                padding: 30px 15px 16px;
            }

            .logo {
                width: 300px;
            }

            .contacts {
                column-gap: 5px;
            }

            .contact-icon-wrapper {
                width: 48px;
                height: 48px;
            }

            .contact-icon-wrapper img {
                width: 28px;
                height: 28px;
            }

            .contact-text,
            .contact-text a {
                font-size: 12px;
            }

            .contact-text span {
                font-size: 11px;
            }

            .info-text {
                font-size: 10px;
            }

            .info-col {
                padding: 0 6px;
            }
        }

        /* НИЗКИЕ ЭКРАНЫ */
        @media (max-height: 700px) {
            .page {
                padding-top: 20px;
            }

            .logo {
                width: 260px;
                margin-bottom: 12px;
            }

            .contacts {
                margin-top: 40px;
                margin-bottom: 20px;
                row-gap: 20px;
            }

            .menu-btn-container {
                margin-bottom: 20px;
            }

            .info-block {
                padding-top: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="bg-wrapper">
        <div class="page">

            <!-- ЛОГОТИП -->
            <img
                class="logo"
                src="images/xologo.png"
                alt="XO NIGHTBAR"
            >

            <!-- ЯЗЫКИ -->
            <div class="languages">
                <a href="index.html" class="lang-btn">RU</a>
                <a href="startkz.html" class="lang-btn active">KZ</a>
                <a href="starten.html" class="lang-btn">EN</a>
            </div>

            <!-- КОНТАКТЫ -->
            <div class="contacts">

                <!-- ВРЕМЯ РАБОТЫ -->
                <div class="contact">
                    <div class="contact-icon-wrapper">
                        <img src="images/clock.png" alt="Время">
                    </div>

                    <div class="contact-text">
                        Время работы
                        <span>23:00 – 06:00</span>
                    </div>
                </div>

                <!-- ТЕЛЕФОН -->
                <div class="contact">
                    <div class="contact-icon-wrapper">
                        <img src="images/phone.png" alt="Телефон">
                    </div>

                    <div class="contact-text">
                        <a href="tel:+77071710747">
                            Телефон
                            <span>+77052624946</span>
                        </a>
                    </div>
                </div>

                <!-- INSTAGRAM -->
                <div class="contact">
                    <div class="contact-icon-wrapper">
                        <img src="images/instagram.png" alt="Instagram">
                    </div>

                    <div class="contact-text">
                        <a
                            href="https://www.instagram.com/nightbar.xo"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Instagram
                            <span>@nightbar.xo</span>
                        </a>
                    </div>
                </div>

                <!-- WHATSAPP -->
                <div class="contact">
                    <div class="contact-icon-wrapper">
                        <img src="images/whatsapp.png" alt="WhatsApp">
                    </div>

                    <div class="contact-text">
                        <a
                            href="www.wasap.my/77052624946"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            WhatsApp
                            <span>Написать нам</span>
                        </a>
                    </div>
                </div>

            </div>

            <!-- КНОПКА ПЕРЕХОДА В МЕНЮ -->
            <div class="menu-btn-container">
                <a class="menu-button" href="menurus.html">
                    ПЕРЕЙТИ К МЕНЮ &rarr;
                </a>
            </div>

            <!-- ИНФОРМАЦИЯ ВНИЗУ -->
            <div class="info-block">

                <div class="info-col">
                    <div class="info-text">
                        Пожалуйста, предупредите официанта о наличии пищевой аллергии
                    </div>
                </div>

                <div class="info-col">
                    <div class="info-text">
                        Фотографии блюд носят ознакомительный характер и могут отличаться от оригинала
                    </div>
                </div>

            </div>

        </div>
    </div>
</body>

</html>
